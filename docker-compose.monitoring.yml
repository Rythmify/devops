# Run with:
#   docker compose --env-file ./environments/.env.monitoring -f docker-compose.monitoring.yml up -d

networks:
  monitoring:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rythmify_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - alertmanager
      - node_exporter
      - nginx-exporter
      - blackbox_exporter
      - postgres_exporter

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: rythmify_alertmanager
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        wget -q https://github.com/a8m/envsubst/releases/download/v1.2.0/envsubst-Linux-x86_64 -O /tmp/envsubst &&
        chmod +x /tmp/envsubst &&
        /tmp/envsubst < /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD}
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl
    ports:
      - "9093:9093"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: rythmify_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Rythmify Monitoring}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      GF_SERVER_ROOT_URL: https://rythmify-back.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: rythmify_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: rythmify_nginx_exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://host.docker.internal/nginx_status'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9113:9113"
    networks:
      - monitoring

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: rythmify_blackbox_exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - monitoring

  # Reaches PostgreSQL on VM2 private IP 10.0.1.4.
  # Pre-requisite on VM2:
  #   GRANT pg_monitor TO rythmify_admin;
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: rythmify_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://rythmify_admin:${POSTGRES_PASSWORD}@10.0.1.4:5432/rythmify_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
