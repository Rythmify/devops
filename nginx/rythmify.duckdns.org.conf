# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name rythmify.duckdns.org;

    return 301 https://$host$request_uri;
}

# ── HTTPS — frontend static files (React SPA) ─────────────────────────────────
#
# Serves pre-built assets from /var/www/rythmify (deployed by the Frontend CD
# pipeline via rsync). All unknown routes fall back to index.html so
# client-side routing works. API calls go directly to
# rythmify-back.duckdns.org — no proxy on this domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rythmify.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/rythmify.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rythmify.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/rythmify;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
