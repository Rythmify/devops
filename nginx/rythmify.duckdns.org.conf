# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name rythmify.duckdns.org;

    return 301 https://$host$request_uri;
}

# ── HTTPS — frontend (Vite dev server on port 5173) ───────────────────────────
#
# The frontend is a React + Vite application. The Dockerfile runs:
#   npm run dev -- --host 0.0.0.0
# which starts the Vite dev server inside Docker, mapped to host port 5173.
# WebSocket upgrade headers are required for Vite HMR connections.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rythmify.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/rythmify.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rythmify.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for Vite HMR
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
