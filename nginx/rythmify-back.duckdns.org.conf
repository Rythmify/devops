# GeoIP2 — resolves client IP to ISO 3166-1 alpha-2 country code.
# Requires: libnginx-mod-http-geoip2 and /var/lib/GeoIP/GeoLite2-Country.mmdb
# $geoip2_data_country_code is injected as X-Country-Code on every proxied
# request. Backend reads it via req.headers['x-country-code'] (e.g. "EG", "SA").
geoip2 /var/lib/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_data_country_code country iso_code;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name rythmify-back.duckdns.org;

    return 301 https://$host$request_uri;
}

# ── HTTPS — backend API + WebSocket (Socket.IO) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rythmify-back.duckdns.org;

    # Certificate covers both rythmify.duckdns.org and rythmify-back.duckdns.org
    # as Subject Alternative Names. Issued with:
    #   sudo certbot certonly --nginx \
    #     -d rythmify.duckdns.org -d rythmify-back.duckdns.org
    ssl_certificate     /etc/letsencrypt/live/rythmify.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rythmify.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── /health — liveness probe used by Blackbox exporter ──────────────────────
    location /health {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /grafana/ — Grafana dashboard (proxied from port 3000) ──────────────────
    location /grafana/ {
        proxy_pass         http://localhost:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── / — all API and WebSocket traffic ───────────────────────────────────────
    location / {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for Socket.IO long-polling and ws transports
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Country resolved from client IP via MaxMind GeoLite2-Country.
        # Empty string when IP is unresolvable (private ranges, localhost).
        proxy_set_header X-Country-Code $geoip2_data_country_code;

        proxy_cache_bypass $http_upgrade;
    }
}

# ── Nginx stub_status — for prometheus nginx_exporter ─────────────────────────
#
# Binds to the Docker bridge host IP (172.17.0.1) on a dedicated port 8081.
# nginx_exporter in docker-compose.monitoring.yml scrapes:
#   http://172.17.0.1:8081/nginx_status
# Binding to 172.17.0.1 limits access to Docker bridge traffic — this address
# is not reachable from public interfaces or from the VM loopback (127.0.0.1).
server {
    listen 172.17.0.1:8081;
    server_name _;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny  all;
    }

    location / {
        return 444;
    }
}
