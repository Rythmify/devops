global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: backend_metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: postgres_exporter
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: blackbox
    metrics_path: /probe
    params:
      module:
        - https_2xx
    static_configs:
      - targets:
          - https://rythmify-back.duckdns.org/health
          - https://rythmify.duckdns.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
